<div class="jp-account" data-jp-account>
  <button class="jp-account-button" type="button" aria-haspopup="menu" aria-expanded="false" data-jp-account-button>
    <span class="jp-account-avatar" data-jp-account-avatar>
      <span class="material-icons" aria-hidden="true">account_circle</span>
    </span>
    <span class="jp-account-label" data-jp-account-label></span>
    <span class="material-icons jp-account-caret" aria-hidden="true">expand_more</span>
  </button>

  <div class="jp-account-menu" role="menu" data-jp-account-menu hidden>
    <div class="jp-account-summary">
      <strong data-jp-account-name></strong>
      <span data-jp-account-email></span>
    </div>
    <div class="jp-account-row">
      <span data-jp-account-type-label></span>
      <strong data-jp-account-type></strong>
    </div>
    <a class="jp-account-menu-item" href="{{ "internal/admin/" | relLangURL }}" data-jp-admin-link hidden>
      <span class="material-icons" aria-hidden="true">manage_accounts</span>
      <span data-jp-admin-link-label></span>
    </a>
    <button class="jp-account-menu-item" type="button" data-jp-menu-login hidden>
      <span class="material-icons" aria-hidden="true">login</span>
      <span data-jp-menu-login-label></span>
    </button>
    <button class="jp-account-menu-item" type="button" data-jp-logout hidden>
      <span class="material-icons" aria-hidden="true">logout</span>
      <span data-jp-logout-label></span>
    </button>
  </div>
</div>
