{{ if hugo.IsMultilingual }}
  {{ $translations := .AllTranslations }}
  {{ if gt (len $translations) 1 }}
    <nav class="jp-language-switch" aria-label="{{ i18n "lang_select_title" }}">
      {{ range $translations }}
        <a
          class="jp-language-option{{ if eq .Language.Lang $.Language.Lang }} is-active{{ end }}"
          href="{{ .RelPermalink }}"
          rel="alternate"
          hreflang="{{ .Language.Lang }}"
          lang="{{ .Language.Lang }}"
          {{ if eq .Language.Lang $.Language.Lang }}aria-current="page"{{ end }}
          aria-label="{{ .Language.Label }}">
          {{ if eq .Language.Lang "zh-tw" }}繁中{{ else }}EN{{ end }}
        </a>
      {{ end }}
    </nav>
  {{ end }}
{{ end }}
