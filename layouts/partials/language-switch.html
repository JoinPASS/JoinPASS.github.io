{{ if hugo.IsMultilingual }}
  {{ $translations := .AllTranslations }}
  {{ if gt (len $translations) 1 }}
    <div class="jp-global-lang dropdown">
      <button
        class="btn btn-link btn-default jp-global-lang-button dropdown-toggle"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        aria-label="{{ i18n "lang_select_title" }}">
        {{ .Site.Language.Label }}
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        {{ range $translations }}
          <li>
            <a
              class="dropdown-item{{ if eq .Language.Lang $.Language.Lang }} active{{ end }}"
              href="{{ .RelPermalink }}"
              rel="alternate"
              hreflang="{{ .Language.Lang }}"
              lang="{{ .Language.Lang }}">
              {{ .Language.Label }}
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  {{ end }}
{{ end }}
