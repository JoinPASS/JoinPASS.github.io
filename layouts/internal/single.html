{{ define "main" }}
<section class="jp-internal" data-jp-internal-page="admin">
  <div class="container jp-internal-shell">
    <div class="jp-internal-topbar">
      <div class="jp-internal-heading">
        <p class="jp-internal-eyebrow">{{ .Params.eyebrow }}</p>
        <h1>{{ .Title }}</h1>
        <p>{{ .Params.lead }}</p>
      </div>

      {{ partial "internal/account-menu.html" . }}
    </div>

    <div class="jp-internal-alert" data-jp-alert hidden></div>

    <section class="jp-internal-login" data-jp-login-panel>
      <div>
        <p class="jp-panel-label" data-jp-login-kicker></p>
        <h2 data-jp-login-title></h2>
        <p data-jp-login-copy></p>
      </div>
      <button class="btn btn-primary" type="button" data-jp-login>
        <span class="material-icons" aria-hidden="true">login</span>
        <span data-jp-login-label></span>
      </button>
    </section>

    <section class="jp-admin-panel" data-jp-admin-panel hidden>
      <form class="jp-admin-form" data-jp-member-form>
        <div class="jp-section-heading">
          <p class="jp-panel-label" data-jp-admin-form-kicker></p>
          <h2 data-jp-admin-form-title></h2>
          <p data-jp-admin-form-copy></p>
        </div>

        <label class="jp-field">
          <span data-jp-admin-emails-label></span>
          <textarea rows="7" data-jp-member-emails spellcheck="false"></textarea>
        </label>

        <div class="jp-admin-form-row">
          <label class="jp-field">
            <span data-jp-admin-role-label></span>
            <select data-jp-member-role>
              <option value="member" data-jp-role-member></option>
              <option value="admin" data-jp-role-admin></option>
            </select>
          </label>
          <button class="btn btn-primary" type="submit">
            <span class="material-icons" aria-hidden="true">person_add</span>
            <span data-jp-admin-add-label></span>
          </button>
        </div>
      </form>

      <section class="jp-member-list">
        <div class="jp-section-heading">
          <p class="jp-panel-label" data-jp-member-list-kicker></p>
          <h2 data-jp-member-list-title></h2>
        </div>

        <div class="jp-table-wrap">
          <table class="jp-members-table">
            <thead>
              <tr>
                <th data-jp-th-name></th>
                <th data-jp-th-email></th>
                <th data-jp-th-role></th>
                <th data-jp-th-status></th>
                <th data-jp-th-created></th>
                <th data-jp-th-created-by></th>
                <th data-jp-th-actions></th>
              </tr>
            </thead>
            <tbody data-jp-members-body></tbody>
          </table>
        </div>
      </section>
    </section>
  </div>
</section>

{{ partial "internal/app-script.html" (dict "Page" . "pageType" "admin") }}
{{ end }}
